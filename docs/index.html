<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание КФУ им. Вернадского</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header class="top">
  <div class="wrap top__row">
    <div class="crest" title="Герб КФУ им. Вернадского">
      <svg viewBox="0 0 64 72" role="img" aria-label="Герб КФУ">
        <polygon points="32,1 33.15,5.23 36.95,3.05 34.77,6.85 39,8 34.77,9.15 36.95,12.95 33.15,10.77 32,15 30.85,10.77 27.05,12.95 29.23,9.15 25,8 29.23,6.85 27.05,3.05 30.85,5.23" fill="var(--gold)"/>
        <path d="M12,22 Q22,18 32,22 Q42,18 52,22 L52,29 Q42,25 32,29 Q22,25 12,29 Z" fill="#fff" stroke="var(--gold)" stroke-width="1.5"/>
        <line x1="32" y1="22" x2="32" y2="29" stroke="var(--gold)" stroke-width="1.5"/>
        <path d="M14,33 H50 V47 Q50,59 32,67 Q14,59 14,47 Z" fill="var(--bordo)" stroke="var(--gold)" stroke-width="2"/>
        <text x="32" y="55" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--page)" font-family="inherit">КФУ</text>
        <text x="32" y="63" text-anchor="middle" font-size="5.5" fill="var(--gold)" font-family="inherit">1918</text>
      </svg>
    </div>
    <div>
      <h1>📚 Расписание КФУ <span>им. Вернадского</span></h1>
      <p class="sub">Данные с официального сайта <a href="https://cfuv.ru/raspisanie/" target="_blank" rel="noopener">cfuv.ru/raspisanie</a> · выбери факультет и группу</p>
    </div>
    <button id="btnTheme" title="Переключить тему">🌙</button>
  </div>
</header>
<main class="wrap">
  <div class="tabs">
    <button id="tabGroup" class="tab on">Группа</button>
    <button id="tabTeacher" class="tab">Преподаватель 👤</button>
  </div>
  <section class="card" id="paneGroup">
    <div class="grid">
      <label>Институт / факультет
        <select id="selSub"><option value="">Загрузка…</option></select>
      </label>
      <label>Направление
        <select id="selDir" disabled><option value="">—</option></select>
      </label>
      <label>Курс
        <select id="selCourse" disabled><option value="">—</option></select>
      </label>
      <label>Группа
        <select id="selGroup" disabled><option value="">—</option></select>
      </label>
    </div>
    <div class="row">
      <input id="search" list="codes" placeholder="Или введи код группы: ПИ-б-о-241">
      <datalist id="codes"></datalist>
      <button id="btnGo">Показать</button>
    </div>
    <div class="row filters">
      <button data-f="now" class="chip">Сейчас 🟢</button>
      <button data-f="today" class="chip on">Сегодня</button>
      <button data-f="tomorrow" class="chip">Завтра</button>
      <button data-f="week" class="chip">Неделя</button>
      <button data-f="even" class="chip">Чётная</button>
      <button data-f="odd" class="chip">Нечётная</button>
    </div>
    <div class="row filters">
      <button data-s="0" class="chip sub on">Вся группа</button>
      <button data-s="1" class="chip sub">Подгруппа 1</button>
      <button data-s="2" class="chip sub">Подгруппа 2</button>
      <button id="btnIcs" title="Скачать календарь для телефона">📅 .ics</button>
    </div>
    <p id="status" class="status"></p>
  </section>
  <section class="card" id="paneTeacher" hidden>
    <div class="row">
      <input id="tSearch" placeholder="Фамилия преподавателя: Парменов">
      <button id="btnTeacher">Найти</button>
    </div>
    <p class="status">Пары преподавателя по всем группам · минимум 2 буквы</p>
  </section>
  <section id="out"></section>
</main>
<footer class="wrap foot">Сделано студентом для студентов · парсер: <code>parser.py</code> · бот: <code>bot.py</code></footer>
<script src="app.js"></script>
</body>
</html>
